name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack tarball
        run: npm pack
      - name: Install tarball into a clean directory and smoke-test the bin
        run: |
          TGZ="$GITHUB_WORKSPACE/$(ls startgg-mcp-server-*.tgz)"
          mkdir -p /tmp/pkgtest
          cd /tmp/pkgtest
          npm init -y > /dev/null
          npm install "$TGZ" > /dev/null
          cd "$GITHUB_WORKSPACE"
          node scripts/pack-smoke.mjs \
            /tmp/pkgtest/node_modules/startgg-mcp-server \
            /tmp/pkgtest/node_modules/.bin/startgg-mcp-server
