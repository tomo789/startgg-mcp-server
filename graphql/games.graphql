query GetSetGames($id: ID!) {
  set(id: $id) {
    id
    identifier
    round
    fullRoundText
    state
    startedAt
    completedAt
    winnerId
    displayScore
    totalGames
    vodUrl
    phaseGroup {
      id
      displayIdentifier
      phase {
        id
        name
      }
    }
    slots {
      slotIndex
      entrant {
        id
        name
        initialSeedNum
        isDisqualified
        participants {
          player {
            id
            gamerTag
            prefix
          }
        }
      }
      standing {
        placement
        stats {
          score {
            label
            value
            displayValue
          }
        }
      }
    }
    event {
      id
      name
      slug
      tournament {
        id
        name
        slug
      }
    }
    stream {
      id
      streamSource
      streamName
    }
    games {
      id
      orderNum
      state
      winnerId
      entrant1Score
      entrant2Score
      stage {
        id
        name
      }
      selections {
        selectionType
        selectionValue
        entrant {
          id
        }
        character {
          id
          name
        }
      }
    }
  }
}
